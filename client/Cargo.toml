[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
automerge = "0.11.0"
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
